name = "weather_app"
version = "1.0.0"
description = "Example Gleam frontend app calling a weather API, with http_server_mock_js integration tests"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json   = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
gleeunit            = ">= 1.0.0 and < 2.0.0"
gleam_http          = ">= 4.3.0 and < 5.0.0"
http_server_mock    = { path = "../../http_server_mock_core" }
http_server_mock_js = { path = "../../http_server_mock_js" }
